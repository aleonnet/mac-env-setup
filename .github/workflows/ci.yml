name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MACENV_USE_GUM: "0"   # sem download de gum em CI (rede/flake)

jobs:
  test:
    name: portão único (o mesmo do desenvolvedor)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # UM portão, o mesmo que roda na máquina de quem desenvolve — as
      # asserções (e as armadilhas documentadas do `! grep` e do
      # `starship print-config`) moram em tools/gate.sh. Repetir os comandos
      # aqui foi o que fez CI e local discordarem (shellcheck flutuante do
      # brew); o gate fixa a versão e o CI herda.
      - name: ./tools/gate.sh
        run: ./tools/gate.sh
